<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07130d">
<meta name="description" content="免费网页版德州扑克（无限注）朋友局 · 仅限娱乐筹码，非真钱">
<title>德州扑克 · 朋友局</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<!-- ============ 大厅 Lobby ============ -->
<main id="lobby" class="screen">
  <div class="lobby-inner">
    <div class="hero">
      <div class="hero-cards" aria-hidden="true">
        <div class="card big hero-c c1 s0"><span class="ci"><b>A</b><i>♠&#xFE0E;</i></span><span class="cc ace">♠&#xFE0E;</span><span class="ci ci2"><b>A</b><i>♠&#xFE0E;</i></span></div>
        <div class="card big hero-c c2 s1"><span class="ci"><b>K</b><i>♥&#xFE0E;</i></span><span class="court"><b>K</b><i>♚&#xFE0E;</i></span><span class="ci ci2"><b>K</b><i>♥&#xFE0E;</i></span></div>
        <div class="card big hero-c c3 s2"><span class="ci"><b>Q</b><i>♦&#xFE0E;</i></span><span class="court"><b>Q</b><i>♛&#xFE0E;</i></span><span class="ci ci2"><b>Q</b><i>♦&#xFE0E;</i></span></div>
      </div>
      <div class="hero-chips" aria-hidden="true"><i class="chip-d d1000"></i><i class="chip-d d5000"></i><i class="chip-d d25000" data-v="25K"></i></div>
      <h1 class="logo"><span class="logo-main">德州扑克</span><span class="logo-sub">HOLD'EM · 朋友局</span></h1>
      <p class="subtitle">无限注德州扑克 · 每人 <b>100,000</b> 虚拟筹码<br><span class="muted">仅供娱乐 · 筹码无任何价值 · 不涉及真钱</span></p>
    </div>

    <label class="field">
      <span>你的昵称</span>
      <input id="nick" maxlength="12" placeholder="输入昵称" autocomplete="nickname">
    </label>

    <section class="card-panel" id="join-panel">
      <h2><span class="ic">🔗</span>加入朋友的房间</h2>
      <div class="row">
        <input id="join-code" class="code-input" maxlength="300" placeholder="房间码 / 粘贴邀请链接" autocapitalize="characters" autocomplete="off">
        <button id="btn-join" class="btn primary">加入</button>
      </div>
    </section>

    <section class="card-panel">
      <h2><span class="ic">👑</span>创建房间（我当房主）</h2>
      <p class="muted small">创建后把链接发到微信群，朋友点开即可加入。房主的浏览器负责发牌，请保持页面打开。</p>
      <button id="btn-host" class="btn primary wide">创建房间</button>
    </section>

    <section class="card-panel" id="solo-panel">
      <h2><span class="ic">🤖</span>单机练习（对战 AI）</h2>
      <p class="muted small">每个 AI 都有自己的性格，点性格可以切换。无需联网。</p>
      <div id="solo-lineup" class="lineup"></div>
      <div class="row lineup-ctl">
        <button id="btn-bot-minus" class="btn ghost-btn" aria-label="减少 AI">－</button>
        <span id="bot-count" class="bot-count">4 个 AI</span>
        <button id="btn-bot-plus" class="btn ghost-btn" aria-label="增加 AI">＋</button>
        <button id="btn-solo" class="btn green">开始单机</button>
      </div>
    </section>

    <p id="lobby-msg" class="lobby-msg"></p>
    <p class="muted small foot">默认盲注 500/1,000 · 每回合 30 秒 · 支持 2–8 人 · <a href="#" id="lnk-rules">牌型大小</a></p>
  </div>
</main>

<!-- ============ 牌桌 Table ============ -->
<div id="game" class="screen hidden">
  <header class="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="菜单">☰</button>
    <div class="top-info">
      <div id="room-label" class="room-label"></div>
      <div id="blind-label" class="blind-label"></div>
    </div>
    <button id="net-dot" class="net-pill hidden" title="连接状态" aria-label="连接状态"></button>
    <button id="btn-log" class="icon-btn" aria-label="牌局记录" title="牌局记录">📜</button>
    <button id="btn-ledger" class="icon-btn" aria-label="账本" title="账本 / 买筹码">📒</button>
    <button id="btn-mute" class="icon-btn" aria-label="音效">🔊</button>
    <button id="btn-invite" class="btn small-btn">邀请</button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <div id="table-wrap">
    <div id="table">
      <div class="rail"><div class="felt"><div class="felt-light"></div><div class="felt-line"></div><div class="felt-logo"><span class="fl-suits">♠ ♥ ♣ ♦</span><span class="fl-name">HOLD'EM</span><span class="fl-sub">朋友局</span></div></div></div>
      <div id="pot" class="pot"></div>
      <div id="center">
        <div id="board" class="board"></div>
        <div id="center-msg" class="center-msg"></div>
      </div>
      <div id="seats"></div>
      <div id="fx"></div>
    </div>
  </div>
  <div id="action-bar"></div>
  <div id="log" class="log"></div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" aria-label="关闭">✕</button><div id="modal-body"></div></div></div>


<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/app.js?v=6"></script>
</body>
</html>
